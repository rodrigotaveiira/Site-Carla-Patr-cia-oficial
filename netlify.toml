[build]
  command = "vite build"
  publish = "dist/client"
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Cabeçalhos de segurança. IMPORTANTE: conferir em produção que eles chegam
# TAMBÉM na resposta HTML do SSR (é uma Netlify Function), não só nos assets
# estáticos — `curl -I https://carlapatriciamedina.com`. Se a resposta do SSR
# não trouxer os cabeçalhos, é preciso setá-los no handler do TanStack Start.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP compatível com o que o app usa hoje:
    #  - fontes: Google Fonts (fonts.googleapis.com / fonts.gstatic.com)
    #  - vídeos: iframes de YouTube e Vimeo na página de Aulas
    #  - imagens: próprias + data:/blob: (fotos de perfil e PDFs carimbados
    #    vêm como data URL dos Netlify Blobs)
    #  - 'unsafe-inline' em script/style: o TanStack Start injeta um script de
    #    hidratação inline e o framer-motion aplica estilos inline; este
    #    projeto ainda não usa nonce.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:"

# Endereços *.netlify.app do site mandam pro domínio oficial com 301. Sem isso,
# carlinhamedina.netlify.app servia uma cópia inteira do site, e o endereço
# original (friendly-pothos-3cd60f, onde o site viveu até setembro/2026) dava
# 404 depois do renome — o Google perdeu o histórico dele em vez de transferir
# pro carlapatriciamedina.com. O endereço antigo só responde se o site no
# Netlify tiver esse nome; os deploy previews (deploy-preview-N--...) usam
# outro host e não caem aqui.
[[redirects]]
  from = "https://carlinhamedina.netlify.app/*"
  to = "https://carlapatriciamedina.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://friendly-pothos-3cd60f.netlify.app/*"
  to = "https://carlapatriciamedina.com/:splat"
  status = 301
  force = true
